<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Shemotion Events Admin</title>
    <link rel="icon" href="../assets/favicon_shemotion.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Marcellus&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin.css?v=20260813-1">
  </head>
  <body>
    <header class="admin-header">
      <a href="../" aria-label="View Shemotion website">
        <img src="../assets/shemotion-logo.png" alt="Shemotion">
      </a>
      <a class="header-link" href="../">View website</a>
    </header>

    <main>
      <div class="dashboard-heading">
        <div class="page-heading">
          <p class="eyebrow">Events manager</p>
          <h1>Upcoming Experiences</h1>
          <p>Create, edit and publish the classes shown on the Shemotion website.</p>
        </div>
        <div class="dashboard-actions">
          <button class="text-button" type="button" data-manage-locations>Manage Locations</button>
          <button class="primary-button" type="button" data-new-event>+ Add Event</button>
        </div>
      </div>

      <p class="notice" data-notice role="status" aria-live="polite"></p>
      <div class="admin-view-switch" role="group" aria-label="Choose events view">
        <button class="is-active" type="button" data-admin-view="list" aria-pressed="true">List</button>
        <button type="button" data-admin-view="calendar" aria-pressed="false">Calendar</button>
      </div>
      <div class="event-list" data-event-list data-admin-list-view aria-live="polite">
        <p>Loading events...</p>
      </div>
      <div class="admin-calendar" data-admin-calendar-view hidden>
        <div class="calendar-heading">
          <button type="button" data-admin-calendar-previous aria-label="Previous month">&#8592;</button>
          <h2 data-admin-calendar-label></h2>
          <button type="button" data-admin-calendar-next aria-label="Next month">&#8594;</button>
        </div>
        <div class="calendar-weekdays" aria-hidden="true">
          <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span>
        </div>
        <div class="calendar-grid" data-admin-calendar-grid></div>
      </div>
    </main>

    <dialog class="admin-calendar-dialog" data-admin-calendar-dialog>
      <div class="admin-calendar-dialog-shell">
        <button class="icon-button admin-calendar-dialog-close" type="button" data-admin-calendar-dialog-close aria-label="Close">&#215;</button>
        <div class="admin-calendar-dialog-track" data-admin-calendar-dialog-track></div>
        <div class="admin-calendar-dialog-controls">
          <button type="button" data-admin-calendar-dialog-previous aria-label="Previous event">&#8592;</button>
          <output data-admin-calendar-dialog-counter></output>
          <button type="button" data-admin-calendar-dialog-next aria-label="Next event">&#8594;</button>
        </div>
      </div>
    </dialog>

    <dialog class="locations-dialog" data-locations-dialog>
      <div class="locations-dialog-shell">
        <div class="dialog-heading">
          <div>
            <p class="eyebrow">Saved venues</p>
            <h2>Manage Locations</h2>
          </div>
          <button class="icon-button" type="button" data-locations-close aria-label="Close">&#215;</button>
        </div>
        <div class="locations-manager">
          <div class="locations-list" data-locations-list></div>
          <form class="location-form" data-location-form novalidate>
            <input type="hidden" name="id">
            <div class="location-form-heading">
              <h3 data-location-form-title>New Location</h3>
              <button class="text-button" type="button" data-new-location>New</button>
            </div>
            <label>Venue name<input name="name" maxlength="120" required></label>
            <label>Suburb<input name="suburb" maxlength="80"></label>
            <label>Street address<input name="address" maxlength="200" placeholder="Unit 3/76 Ferry Rd, Southport QLD 4215" required></label>
            <div class="coordinate-fields">
              <label>Latitude<input name="latitude" type="number" min="-90" max="90" step="any" inputmode="decimal"></label>
              <label>Longitude<input name="longitude" type="number" min="-180" max="180" step="any" inputmode="decimal"></label>
            </div>
            <label>Google Maps URL <span class="optional-label">Paste the Maps link here, not above</span><input name="googleMapsUrl" type="url" maxlength="1000" placeholder="https://maps.app.goo.gl/..."></label>
            <div class="location-verification" data-location-verification hidden>
              <a data-location-google-link target="_blank" rel="noopener noreferrer">Open in Google Maps</a>
              <a data-location-coordinate-link target="_blank" rel="noopener noreferrer">View stored coordinates</a>
            </div>
            <p class="form-error" data-location-error role="alert"></p>
            <button class="primary-button" type="submit">Save Location</button>
          </form>
        </div>
      </div>
    </dialog>

    <dialog data-event-dialog>
      <form method="dialog" class="dialog-shell" data-event-form novalidate>
        <div class="dialog-heading">
          <div>
            <p class="eyebrow">Event details</p>
            <h2 data-form-title>Add Event</h2>
          </div>
          <button class="icon-button" type="button" data-close aria-label="Close">&#215;</button>
        </div>

        <input type="hidden" name="id">
        <div class="form-grid">
          <label class="field-wide template-field">Create from existing event <span class="optional-label">Optional</span>
            <select name="templateSource" data-template-select><option value="">Start with a blank event</option></select>
          </label>
          <label class="field-wide">Event title<input name="title" maxlength="120" required></label>
          <label>Event type
            <select name="eventType" required>
              <option>Class</option><option>Workshop</option><option>Retreat</option><option>Private event</option>
            </select>
          </label>
          <label class="field-wide">Saved location
            <select name="locationId" data-location-select><option value="new">Create a new location</option></select>
          </label>
          <label>Venue name<input name="venueName" maxlength="120" required data-location-field></label>
          <label>Suburb<input name="suburb" maxlength="80" data-location-field></label>
          <label class="field-wide">Address<input name="address" maxlength="200" data-location-field></label>
          <label>Date status
            <select name="dateStatus" required>
              <option value="scheduled">Scheduled</option>
              <option value="tbc">Date to be confirmed</option>
            </select>
          </label>
          <span aria-hidden="true"></span>
          <label>Start date<input name="startDate" type="date" data-date-field required></label>
          <label>Start time<input name="startTime" type="time" data-date-field required></label>
          <label>End date<input name="endDate" type="date" data-date-field></label>
          <label>End time<input name="endTime" type="time" data-date-field></label>
          <label>Repeats
            <select name="recurrenceFrequency">
              <option value="none">Does not repeat</option>
              <option value="weekly">Every week</option>
              <option value="fortnightly">Every fortnight</option>
              <option value="monthly">Every month</option>
            </select>
          </label>
          <label>Repeat until <span class="optional-label">Optional</span><input name="recurrenceUntil" type="date"></label>
          <label>Audience<input name="audience" maxlength="80" value="Women only" required></label>
          <label>Availability
            <select name="availabilityStatus" required>
              <option>Available</option><option>Limited spaces</option><option>Sold out</option><option>Cancelled</option>
            </select>
          </label>
          <label class="field-wide"><span>Short description <span class="optional-label">Optional</span></span><textarea name="shortDescription" maxlength="600" rows="4"></textarea></label>
          <label>Booking button text<input name="bookingLabel" maxlength="60" value="Book now" required></label>
          <label>Booking URL<input name="bookingUrl" type="url" maxlength="500" placeholder="https://"></label>
          <label>Display order<input name="displayOrder" type="number" min="-1000" max="1000" value="0"></label>
          <label class="checkbox-field"><input name="isPublished" type="checkbox"> Published</label>
        </div>

        <p class="form-error" data-form-error role="alert"></p>
        <div class="form-actions">
          <button class="text-button danger-button" type="button" data-delete hidden>Delete Event</button>
          <button class="text-button" type="button" data-duplicate hidden>Duplicate</button>
          <span class="action-spacer"></span>
          <button class="text-button" type="button" data-close>Cancel</button>
          <button class="primary-button" type="submit">Save Event</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="admin.js?v=20260813-2"></script>
  </body>
</html>
